<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Purchases Admin | Green Truth</title>
    <link rel="icon" type="image/x-icon" href="resources/Favicon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #eef4ea;
        --panel: #fff;
        --line: #d8e2d2;
        --text: #203025;
        --muted: #607064;
        --accent: #2f7a45;
        --danger: #9f3333;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Georgia, serif;
        background: var(--bg);
        color: var(--text);
      }
      .shell {
        display: grid;
        grid-template-columns: minmax(220px, 260px) 1fr;
        min-height: 100dvh;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100dvh;
        background: #f5f7f3;
        border-right: 1px solid var(--line);
        padding: 24px 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        margin-bottom: 18px;
      }
      .brand img {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }
      .nav a {
        display: flex;
        gap: 10px;
        align-items: center;
        text-decoration: none;
        color: var(--text);
        padding: 10px 12px;
        border-radius: 12px;
        margin-bottom: 6px;
      }
      .nav a.active {
        background: var(--accent);
        color: #fff;
      }
      .main {
        min-width: 0;
        padding: 28px;
      }
      .topbar,
      .panel-head,
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      .panel,
      .purchase {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(34, 53, 31, 0.06);
      }
      .list {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }
      .purchase {
        display: grid;
        gap: 10px;
      }
      .meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }
      .pill {
        display: inline-flex;
        width: max-content;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        background: #e7f4e7;
        color: var(--accent);
      }
      .muted {
        color: var(--muted);
      }
      button,
      select {
        border: none;
        border-radius: 12px;
        padding: 11px 14px;
        font: inherit;
        font-weight: 700;
        min-height: 44px;
      }
      button {
        cursor: pointer;
      }
      .action {
        background: var(--accent);
        color: #fff;
      }
      .ghost {
        background: #edf3eb;
        color: var(--text);
      }
      .message {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #f7faf5;
      }
      .hidden {
        display: none;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 24px;
      }
      @media (max-width: 900px) {
        .shell {
          display: block;
        }
        .sidebar {
          position: static;
          height: auto;
        }
        .main {
          padding: 12px;
        }
        .topbar,
        .panel-head,
        .row {
          display: grid;
        }
      }
    </style>
      <script src="auth-guard.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="resources/logo_type_shit.png" alt="Green Truth logo" /><span
            >Green Truth</span
          >
        </div>
        <nav class="nav">
          <a href="dashboard.html"
            ><span class="material-symbols-outlined">dashboard</span>Bảng Điều
            Khiển</a
          >
          <a href="GreenCoinShop.html"
            ><span class="material-symbols-outlined">redeem</span>Green Coin
            Shop</a
          >
          <a class="active" href="GreenCoinPurchasesAdmin.html"
            ><span class="material-symbols-outlined">admin_panel_settings</span
            >Purchase Admin</a
          >
          <a href="GreenCombatCoinsAdmin.html"
            ><span class="material-symbols-outlined">paid</span>Coin Admin</a
          >
          <a href="login.html" id="signOutBtn"
            ><span class="material-symbols-outlined">logout</span>Đăng Xuất</a
          >
        </nav>
      </aside>
      <main class="main">
        <div class="topbar">
          <div>
            <div class="muted">Active admins only</div>
            <h1>Manage User Purchases</h1>
          </div>
          <div id="userLabel" class="pill">Đang tải...</div>
        </div>
        <section class="panel">
          <div class="panel-head">
            <div>
              <h3>Purchases</h3>
              <p class="muted">View and update Coin Shop purchase status.</p>
            </div>
            <button id="refreshBtn" class="ghost" type="button">Refresh</button>
          </div>
          <div id="accessMessage" class="message hidden"></div>
        </section>
        <section id="purchaseList" class="list">
          <div class="empty">Loading purchases...</div>
        </section>
      </main>
    </div>
    <script>
      const SUPABASE_URL = "https://pnyjxbrkiifrsrtmnxro.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InBueWp4YnJraWlmcnNydG1ueHJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MDgxOTAsImV4cCI6MjA4ODE4NDE5MH0.uCYdN3SaANJZc5XqT1AdcbjlrFHCY7xaS2ff_y4z84c";
      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const $ = (id) => document.getElementById(id);
      const fmt = (n) => Number(n || 0).toLocaleString("vi-VN");
      const escapeHtml = (value) =>
        String(value ?? "").replace(
          /[&<>'"]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[char],
        );
      let session = null;
      let purchases = [];
      function setMessage(text, isError = false) {
        $("accessMessage").textContent = text || "";
        $("accessMessage").classList.toggle("hidden", !text);
        $("accessMessage").style.color = isError ? "#8d2f2f" : "";
      }
      function dateText(value) {
        return value ? new Date(value).toLocaleString("vi-VN") : "";
      }
      async function loadPurchases() {
        const { data, error } = await client.rpc(
          "admin_list_coin_shop_purchases",
        );
        if (error) {
          setMessage(`Access denied or load failed: ${error.message}`, true);
          $("purchaseList").innerHTML =
            '<div class="empty">No access or no purchases loaded.</div>';
          return;
        }
        purchases = data || [];
        setMessage("Admin access confirmed.");
        renderPurchases();
      }
      function renderPurchases() {
        const list = $("purchaseList");
        if (!purchases.length) {
          list.innerHTML = '<div class="empty">No purchases yet.</div>';
          return;
        }
        list.innerHTML = purchases
          .map(
            (p) =>
              `<article class="purchase"><div class="row"><div><span class="pill">${escapeHtml(p.status)}</span><h3>${escapeHtml(p.item_title)}</h3><div class="muted">${escapeHtml(dateText(p.created_at))}</div></div><div><select data-status="${escapeHtml(p.id)}"><option value="pending">pending</option><option value="processing">processing</option><option value="completed">completed</option><option value="cancelled">cancelled</option></select><button class="action" data-save="${escapeHtml(p.id)}" type="button">Update</button></div></div><div class="meta"><div><strong>Buyer</strong><br>${escapeHtml(p.buyer_email || p.buyer_id)}</div><div><strong>Name</strong><br>${escapeHtml(p.full_name)}</div><div><strong>Phone</strong><br>${escapeHtml(p.phone || "-")}</div><div><strong>Coins</strong><br>${fmt(p.coin_amount)}</div><div><strong>Address</strong><br>${escapeHtml(p.home_address)}</div><div><strong>Note</strong><br>${escapeHtml(p.note || "-")}</div></div></article>`,
          )
          .join("");
        list.querySelectorAll("[data-status]").forEach((sel) => {
          const p = purchases.find((x) => x.id === sel.dataset.status);
          if (p) sel.value = p.status;
        });
        list
          .querySelectorAll("[data-save]")
          .forEach(
            (btn) => (btn.onclick = () => updateStatus(btn.dataset.save)),
          );
      }
      async function updateStatus(id) {
        const select = document.querySelector(`[data-status="${id}"]`);
        const { data, error } = await client.rpc(
          "admin_update_coin_shop_purchase_status",
          { p_purchase_id: id, p_status: select.value },
        );
        if (error) {
          setMessage(error.message, true);
          return;
        }
        purchases = purchases.map((p) => (p.id === id ? data : p));
        setMessage("Purchase status updated.");
        renderPurchases();
      }
      async function sync(nextSession) {
        session = nextSession;
        if (!session) {
          location.href = "login.html";
          return;
        }
        $("userLabel").textContent = session.user.email || "Signed in";
        await loadPurchases();
      }
      $("refreshBtn").onclick = loadPurchases;
      $("signOutBtn").onclick = async (e) => {
        e.preventDefault();
        await client.auth.signOut();
        location.href = "login.html";
      };
      client.auth.onAuthStateChange((_event, nextSession) => sync(nextSession));
      client.auth.getSession().then(({ data: { session } }) => sync(session));
    </script>
  </body>
</html>
